[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literarygiant-cli"
version = "0.1.0"
description = "LiteraryGiant custom agent CLI scaffold."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lg = "lg_cli.main:main"
literarygiant = "lg_cli.main:main"

[tool.setuptools.packages.find]
include = ["lg_cli*"]
