[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literarygiant-cli"
version = "0.3.0"
description = "LiteraryGiant literary agent runtime and CLI."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.125,<1",
    "mcp>=1.28,<2",
    "jsonschema>=4.20,<5",
    "typing-extensions>=4.9,<5",
    "prompt-toolkit>=3.0.48,<4",
    "rich>=13.9,<15",
    "tomli>=2.2.1; python_version < '3.11'",
]

[project.scripts]
lg = "lg_cli.main:main"
literary = "lg_cli.main:main"
literarygiant = "lg_cli.main:main"

[tool.setuptools.packages.find]
include = ["lg_cli*"]

[tool.setuptools.package-data]
lg_cli = ["resources/*.json", "resources/*.txt"]
