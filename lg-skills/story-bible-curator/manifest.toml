schema_version = "lg.skill.v1"
id = "story-bible-curator"
legacy_id = "story_bible_curator"
version = "1.0.0"
entrypoint = "SKILL.md"
inputs = ["candidate_facts", "canonical_facts", "ideas", "source_versions", "author_decisions"]
outputs = ["fact_proposals", "conflict_report", "provenance", "recommended_decisions"]
tools = ["memory_read", "memory_update", "write_report"]
quality_checks = ["fact state is explicit", "source version is retained", "conflicts are visible", "proposals require author action", "no silent overwrite"]
failure_modes = ["speculation promoted to canon", "missing provenance", "duplicate contradictory facts", "silent overwrite", "memory spam"]
